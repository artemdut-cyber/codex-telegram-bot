name: Dependency PR Auto Merge

on:
  workflow_run:
    workflows:
      - CI
      - Codex PR Review
    types:
      - completed

permissions:
  contents: write
  pull-requests: write
  checks: read
  statuses: read

jobs:
  merge:
    name: Merge Verified Dependency PRs
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    concurrency:
      group: dependency-pr-auto-merge
      cancel-in-progress: false
    steps:
      - name: Checkout trusted default-branch policy
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Merge eligible dependency PRs
        env:
          GH_TOKEN: ${{ secrets.CODEX_AUTOMATION_TOKEN || github.token }}
          REPO: ${{ github.repository }}
        run: node scripts/dependency-pr-auto-merge.mjs
